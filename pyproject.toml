[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trainproof"
version = "0.1.0"
description = "Proof-carrying checkpoints for deterministic distributed training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
trainproof = "trainproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

